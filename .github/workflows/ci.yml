# BUILD-SPEC §14.2 — the checks that run on every PR.
#
# §14.2's pipeline is:
#   typecheck -> lint -> unit + component -> build (assert: 0 dynamic routes)
#   -> E2E on preview -> axe -> Lighthouse CI
#
# All of it runs here now except the deploy. The browser half is a separate
# `browser` job rather than more steps on `verify`: it installs a ~115 MB
# Chromium and takes minutes, and there is no reason a typo in a unit test
# should wait for it. Both are required checks, so nothing merges on the fast
# one alone.
#
# WHY THIS FILE EXISTS AT ALL. Until now every gate in this repo was manual: four
# build-output checkers, a 823-assertion redirect probe, a production contract
# suite and 100 unit tests, none of which anything ran automatically. AUDIT G2
# is the old pipeline's `trigger: none` — a CI config that had to be run by hand
# and therefore wasn't. §14.4 says: "Automated deploy on merge to main. No
# `trigger: none`."
#
# Deployment is deliberately NOT in this file yet: it needs GCP credentials and
# the Cloud Run service to exist (§3.6). Adding a deploy job that cannot
# authenticate would be the same lie in a new place.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR cancels the first: these jobs build the site
# twice over and there is no value in finishing a run nobody will read.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: helloverify-web

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # Matches the runtime the project is developed against. @types/node is
          # pinned to ^24 for the same reason (vitest 5 requires >=22).
          node-version: 24
          cache: npm
          cache-dependency-path: helloverify-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # §14.2's "lint (incl. token + logical-property rules)". Both custom rules
      # are in tools/eslint/ and run as errors: hv/no-color-literal and
      # hv/logical-css.
      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # §14.2: "build (assert: 0 dynamic routes)". §5 makes every page static;
      # a route that silently becomes dynamic loses the prerendered HTML every
      # SEO gate in this repo depends on, and would otherwise only show up as a
      # latency regression months later. The Proxy/middleware line is expected
      # and is excluded by matching the route-table marker specifically.
      - name: Assert zero dynamic routes
        run: node tools/ci/assert-static.mjs

      # The four build-output gates: sitemap/canonical/hreflang, the JSON-LD
      # graph, llms.txt, the §9.1 performance budgets, and the client-bundle
      # secret grep.
      - name: SEO, performance and secret gates
        run: npm run check:all

      # §6.3 and §14.3 against a real server. `next start` is not a deployment,
      # so the CDN and DNS assertions in the contract suite degrade to warnings
      # there — the suite decides that from the URL, not from a flag.
      # `&` alone would end with the step, so the server is disowned and the
      # next step polls for it. No `wait-on` dependency for a four-line loop.
      - name: Start the built site
        run: |
          npx next start -p 3100 > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100/en && exit 0
            sleep 1
          done
          echo "server did not start"; cat "$RUNNER_TEMP/server.log"; exit 1

      - name: Redirect probe (§6.3)
        run: npm run probe:redirects http://localhost:3100

      - name: Production contract (§14.3)
        run: npm run contract http://localhost:3100

  # §14.2's last three steps: E2E, page-level axe, and Lighthouse CI. Separate
  # from `verify` because of the browser download, and because these are the
  # slow ones.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: helloverify-web/package-lock.json

      - name: Install
        run: npm ci

      # Chromium only. The suite pins one browser deliberately: these are
      # accessibility and performance measurements, and a number that moves with
      # whichever browser the runner happened to have is not a measurement.
      # `--with-deps` installs the shared libraries the headless build needs on
      # a bare runner.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # Playwright starts its own `next start`: `reuseExistingServer` is false
      # when CI is set, so it will not silently adopt a stale server. The
      # BUILD_ID guard in tools/e2e/global-setup.ts is the backstop.
      - name: E2E, and axe in a browser
        run: npm run test:e2e

      # §9.1's `timings` budgets, which cannot be measured from build output.
      # Needs its own server because Playwright's only lives for the test run.
      #
      # `continue-on-error` for one reason, stated so it is not mistaken for
      # indifference: this step dies roughly every other run on Windows in
      # chrome-launcher's teardown (EPERM removing its temp profile, AFTER the
      # audit). It is expected to be a Windows-only file-locking problem and
      # this job is the first chance to find out. If it proves reliable here,
      # remove this line and let it gate.
      - name: Lighthouse budgets (§9.1 timings)
        continue-on-error: true
        run: |
          npx next start -p 3100 > "$RUNNER_TEMP/lh-server.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3100/en && break
            sleep 1
          done
          npm run perf:lab

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports
          path: |
            helloverify-web/playwright-report/
            helloverify-web/test-results/
            helloverify-web/.lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  # Still not wired up, and visible in the checks list rather than only in a
  # doc. Deployment needs GCP credentials and the Cloud Run service to exist
  # (§3.6); adding a job that cannot authenticate would repeat AUDIT G2.
  #
  # The hi/ar rows §14.2 asks for are deferred with Part 9 — `routing.locales`
  # declares `en` only, so there is no second locale to switch to or mirror.
  todo:
    runs-on: ubuntu-latest
    steps:
      - name: Not yet implemented
        run: |
          echo "BUILD-SPEC 14.2, still missing:"
          echo "  - deploy on merge       (needs GCP credentials and the Cloud Run service)"
          echo "  - E2E: locale switching and RTL   (needs hi/ar copy - TASKS.md Part 9)"
